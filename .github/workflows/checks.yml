name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the site
        run: node tools/check.mjs
      - name: Pack a trial release
        run: bash tools/pack.sh 0.0.0-check "$GITHUB_SHA" /tmp/trial
