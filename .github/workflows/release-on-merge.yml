name: Release on merge

# A version is published only when the operator merges a pull request titled "vX.Y.Z: <what it delivers>".
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the version from the pull request title
        id: v
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ "$TITLE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?):[[:space:]] ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "The title is not 'vX.Y.Z: ...': nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the site
        if: steps.v.outputs.version != ''
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "Tag v$VERSION already exists" >&2; exit 1; fi
          node tools/check.mjs
      # The database rules ship with the release: published first, then tested live with temporary accounts.
      # If either step fails, no release is created.
      - name: Publish and test the database rules
        if: steps.v.outputs.version != ''
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDIUM101 }}
        run: |
          set -euo pipefail
          node tools/deploy-rules.mjs
          node tools/test-rules.mjs
      - name: Pack and publish the release
        if: steps.v.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # The previous release's assets ship too, so a page still cached from it keeps working (tools/pack.sh).
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)"
          mkdir -p previous
          if [ -n "$previous" ]; then gh release download "$previous" --pattern 'studium-dist-*.tar.gz' --dir previous || true; fi
          bash tools/pack.sh "$VERSION" "$SHA" out "$(ls previous/*.tar.gz 2>/dev/null | head -1)"
          gh release create "v$VERSION" out/* --target "$SHA" --title "v$VERSION" --notes "Studium v$VERSION"
